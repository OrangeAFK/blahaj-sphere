[project]
name = "blahajsphere"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi",
  "uvicorn",
  "pywebview",
  "sqlmodel",
  "pyyaml",
  "httpx",
  "faster-whisper>=1.2.1",
  "sounddevice>=0.5.6",
  "piper-tts>=1.8.0",
  "numpy>=2.4.6",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
